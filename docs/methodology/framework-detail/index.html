      document.title = framework.title + " | " + document.title;
      setText("framework-detail-badge", "#" + framework.index + " · " + framework.category_name);
      setText("framework-detail-title", framework.title);
      setText("framework-detail-summary", framework.summary);

      setHtml(
        "framework-detail-meta",
        [
          { label: "提出者", value: framework.proposer },
          { label: "类型", value: framework.category_name },
          { label: "适合", value: framework.suitable_for },
          { label: "年代", value: framework.era },
          { label: "引用", value: framework.reference }
        ].map(function (item) {
          return '<div class="framework-detail-meta-item"><p class="framework-detail-meta-label">' +
            escapeHtml(item.label) + '</p><p class="framework-detail-meta-value">' + escapeHtml(item.value) + '</p></div>';
        }).join("")
      );

      setText("framework-detail-problem-title", config.problemTitle);
      setHtml(
        "framework-detail-problem-copy",
        config.problem.map(function (paragraph) {
          return "<p>" + escapeHtml(paragraph) + "</p>";
        }).join("")
      );

      setText("framework-detail-structure-title", config.structureTitle);
      setText("framework-detail-structure-intro", config.structureIntro);
      setHtml(
        "framework-detail-structure-strip",
        structure.map(function (item) {
          return '<div class="framework-detail-structure-strip-item"><strong>' + escapeHtml(item.short) +
            '</strong><span>' + escapeHtml(item.label) + "</span></div>";
        }).join("")
      );
      setHtml(
        "framework-detail-structure-grid",
        structure.map(function (item) {
          return '<article class="framework-detail-structure-card"><p class="framework-detail-structure-short">' +
            escapeHtml(item.short) + '</p><h3>' + escapeHtml(item.label) + '</h3><p>' + escapeHtml(item.description) + "</p></article>";
        }).join("")
      );

      setText("framework-detail-scenario-title", config.scenariosTitle);
      setText("framework-detail-scenario-intro", config.scenariosIntro);
      setHtml(
        "framework-detail-scenario-grid",
        scenarios.map(function (item) {
          return '<article class="framework-detail-scenario-card"><p class="framework-detail-scenario-icon">' +
            escapeHtml(item.icon) + '</p><h3>' + escapeHtml(item.title) + '</h3><p>' + escapeHtml(item.description) + "</p></article>";
        }).join("")
      );

      setText("framework-detail-example-title", config.exampleTitle);
      setHtml(
        "framework-detail-example-copy",
        getExampleCopy(framework).map(function (paragraph) {
          return "<p>" + escapeHtml(paragraph) + "</p>";
        }).join("")
      );
      setText("framework-detail-example-output", getOutput(framework));

      setText("framework-detail-history-title", config.historyTitle);
      setText("framework-detail-history-intro", framework.title + " 背后既有提出者、也有传播它的经典资料。理解它的来路，能帮助你判断这个方法适合用在什么深度和边界里。");
      setHtml(
        "framework-detail-timeline",
        timeline.map(function (item) {
          return '<div class="framework-detail-timeline-item"><div class="framework-detail-timeline-year">' +
            escapeHtml(item.year) + '</div><div class="framework-detail-timeline-dot"></div><div class="framework-detail-timeline-content"><h3>' +
            escapeHtml(item.title) + '</h3><p>' + escapeHtml(item.body) + "</p></div></div>";
        }).join("")
      );

      setText("framework-detail-related-title", config.relatedTitle);
      setText("framework-detail-related-intro", "如果想把它放进更完整的产品工作流里，通常会和这些方法形成前后衔接。");
      setHtml(
        "framework-detail-related-list",
        related.map(function (item) {
          return '<a class="framework-detail-related-item" href="' + escapeHtml(item.href) + '"><strong>' +
            escapeHtml(item.title) + '</strong><span>' + escapeHtml(item.description) + "</span></a>";
        }).join("")
      );

      setText("framework-detail-next-label", "继续阅读下一个");
      const nextLink = document.getElementById("framework-detail-next-link");
      const nextTitle = document.getElementById("framework-detail-next-title");
      if (nextLink && nextFramework) {
        nextLink.href = "?id=" + encodeURIComponent(nextFramework.index);
      }
      if (nextTitle && nextFramework) {
        nextTitle.textContent = nextFramework.title + " #" + nextFramework.index;
      }
    });
  </script>
